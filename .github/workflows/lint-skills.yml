name: lint-skills

on:
  push:
    paths:
      - 'skills/**'
      - 'scripts/lint-skills.py'
      - '.github/workflows/lint-skills.yml'
  pull_request:
    paths:
      - 'skills/**'
      - 'scripts/lint-skills.py'
      - '.github/workflows/lint-skills.yml'

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout 需要；除此之外一概不给
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (node24)
      - name: Lint skills
        run: python3 scripts/lint-skills.py
