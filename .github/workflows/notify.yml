on:
  push:
    branches: [main]
  pull_request:
    types: [opened, closed, reopened]
  issues:
    types: [opened, closed, reopened]
jobs:
  notify:
    runs-on: ubuntu-latest
    permissions: {} # 只用 GITHUB_EVENT_PATH + 发钉钉，不需要任何 token 权限
    # fork PR 拿不到 secrets，跳过（否则 webhook 为空、job 必红）
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: yehuoshun/yehuoshun-notify@e2b1d4281b6ee5a22bfd866e86113d19b1ce06c6 # v1.2.0
        with:
          webhook: ${{ secrets.DINGTALK_WEBHOOK }}
